plugins {
    id 'com.android.application'
}

android {
    namespace 'cat.tmbagent.miralincorporatiu'
    compileSdk 35

    defaultConfig {
        applicationId 'cat.tmbagent.miralincorporatiu.ull9000.sortida.rapid'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.3.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'junit:junit:4.13.2'
}
