plugins {
    id 'com.android.application'
}

def motorSigningStore = System.getenv('MOTOR_SIGNING_STORE_FILE')

android {
    namespace 'cat.tmbagent.miralincorporatiu'
    compileSdk 35

    defaultConfig {
        applicationId 'cat.tmbagent.elmeuservei.motor'
        minSdk 26
        targetSdk 35
        versionCode 46
        versionName '0.14.29'
    }

    signingConfigs {
        if (motorSigningStore) {
            motor {
                storeFile file(motorSigningStore)
                storePassword System.getenv('MOTOR_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('MOTOR_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('MOTOR_SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (motorSigningStore) signingConfig signingConfigs.motor
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'junit:junit:4.13.2'
}
