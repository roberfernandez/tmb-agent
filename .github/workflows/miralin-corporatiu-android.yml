name: El meu servei motor Android

on:
  push:
    branches: [main, feat/el-meu-servei-0.14.29]
    paths:
      - 'miralin-corporatiu-android/**'
      - 'docs/el-meu-servei/**'
      - 'scripts/verify-el-meu-servei-motor.sh'
      - '.github/workflows/miralin-corporatiu-android.yml'
  pull_request:
    paths:
      - 'miralin-corporatiu-android/**'
      - 'docs/el-meu-servei/**'
      - 'scripts/verify-el-meu-servei-motor.sh'
      - '.github/workflows/miralin-corporatiu-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: el-meu-servei-motor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and technical build
        run: gradle -p miralin-corporatiu-android :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify package and version
        run: |
          apk=miralin-corporatiu-android/app/build/outputs/apk/debug/app-debug.apk
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$tools" verify --print-certs "$apk"
          "$(dirname "$tools")/aapt" dump badging "$apk" | sed -n '1p'
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: el-meu-servei-motor-test-reports
          path: miralin-corporatiu-android/app/build/reports/tests/
          retention-days: 30

      # This workflow deliberately does not publish its technical APK. GitHub's
      # ephemeral debug key cannot update the version installed by Róber.
