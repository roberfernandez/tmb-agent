name: Verificar Javascript TMB Agent
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/cquadre.js
      - run: node --check src/main.js
      - run: node --test tests/*.test.js
