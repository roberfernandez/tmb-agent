name: Android ETA diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-overlay/eta-diagnostic/**'
      - 'android-overlay/settings.gradle'
      - '.github/workflows/android-eta-diagnostic.yml'
jobs:
  diagnostic-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build standalone diagnostic APK
        run: gradle -p android-overlay :eta-diagnostic:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: miralin-eta-diagnostic-apk
          path: android-overlay/eta-diagnostic/build/outputs/apk/debug/eta-diagnostic-debug.apk
          retention-days: 7
