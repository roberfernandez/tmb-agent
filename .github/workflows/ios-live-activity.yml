name: Archived iOS native prototype

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios
      - name: Build app and Live Activity widget
        run: xcodebuild -project ios/TMBTrainLive.xcodeproj -scheme TMBTrainLive -sdk iphonesimulator -configuration Debug -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO APS_ENVIRONMENT=development build
