name: Android train eye
on:
  push:
    paths:
      - 'android-overlay/**'
      - '.github/workflows/android-train-eye.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android test app
        run: gradle -p android-overlay :app:testDebugUnitTest :app:assembleDebug
      - name: Build standalone ETA diagnostic APK
        run: gradle -p android-overlay :eta-diagnostic:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: miralin-eta-diagnostic-apk
          path: android-overlay/eta-diagnostic/build/outputs/apk/debug/eta-diagnostic-debug.apk
          retention-days: 7
      - name: Show failing unit tests
        if: failure()
        run: |
          find android-overlay/app/build/test-results/testDebugUnitTest -name '*.xml' -type f -print -exec grep -n -A 5 -B 2 '<failure' {} \; || true
      - name: Read app version
        id: app-version
        run: |
          version=$(awk -F "'" '/versionName/ {print $2}' android-overlay/app/build.gradle)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish direct APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.app-version.outputs.version }}
        run: |
          tag="miralin-tren-ull-v${VERSION}"
          cp android-overlay/app/build/outputs/apk/debug/app-debug.apk "Miralin-Tren-Ull-v${VERSION}.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "Miralin-Tren-Ull-v${VERSION}.apk" --clobber
          else
            gh release create "$tag" "Miralin-Tren-Ull-v${VERSION}.apk" --title "Miralin Tren Ull v${VERSION}" --notes "APK debug per instal·lar manualment a Android."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: miralin-tren-ull-ci-fallback
          path: android-overlay/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
