name: Android train eye
on:
  push:
    paths:
      - 'android-overlay/**'
      - '.github/workflows/android-train-eye.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android test app
        run: |
          set -o pipefail
          gradle -p android-overlay :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/train-eye-gradle.log"
      - name: Verify main APK signature and package
        run: |
          apk=android-overlay/app/build/outputs/apk/debug/app-debug.apk
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$tools" verify --verbose --print-certs "$apk"
          "$(dirname "$tools")/aapt" dump badging "$apk" | sed -n '1p'
      - name: Build standalone ETA diagnostic APK
        run: gradle -p android-overlay :eta-diagnostic:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: miralin-eta-diagnostic-apk
          path: android-overlay/eta-diagnostic/build/outputs/apk/debug/eta-diagnostic-debug.apk
          retention-days: 7
      - name: Show failing unit tests
        if: failure()
        run: |
          find android-overlay/app/build/test-results/testDebugUnitTest -name '*.xml' -type f -print -exec grep -n -A 5 -B 2 '<failure' {} \; || true
      - name: Preserve failure report for debugging from GitHub
        if: failure() && github.ref == 'refs/heads/fix/realistic-eye-eta-minute'
        run: |
          mkdir -p .github/ci-reports
          {
            echo "ANDROID TRAIN EYE FAILURE"
            echo "Commit: $GITHUB_SHA"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Date (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "=== Last Gradle output lines ==="
            if [ -f "$RUNNER_TEMP/train-eye-gradle.log" ]; then
              tail -n 250 "$RUNNER_TEMP/train-eye-gradle.log"
            else
              echo "Gradle step was not reached (or failed before logging)."
            fi
            echo
            echo "=== JUnit failures ==="
            find android-overlay/app/build/test-results/testDebugUnitTest -name '*.xml' -type f 2>/dev/null | while read -r file; do echo "$file"; grep -n -A 8 -B 2 '<failure' "$file" || true; done
          } > .github/ci-reports/android-train-eye-last-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ci-reports/android-train-eye-last-failure.log
          git commit -m "ci: preserve failing Android build diagnostics [skip ci]" || true
          git push origin "HEAD:refs/heads/fix/realistic-eye-eta-minute"
      - name: Read app version
        id: app-version
        run: |
          version=$(awk -F "'" '/versionName/ {print $2}' android-overlay/app/build.gradle)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish direct APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.app-version.outputs.version }}
        run: |
          tag="miralin-tren-ull-v${VERSION}"
          cp android-overlay/app/build/outputs/apk/debug/app-debug.apk "Miralin-Tren-Ull-v${VERSION}.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "Miralin-Tren-Ull-v${VERSION}.apk" --clobber
          else
            gh release create "$tag" "Miralin-Tren-Ull-v${VERSION}.apk" --title "Miralin Tren Ull v${VERSION}" --notes "APK debug per instal·lar manualment a Android."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: miralin-tren-ull-ci-fallback
          path: android-overlay/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
