name: Archived Miralin Tren Ull
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android test app
        run: gradle -p android-overlay :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: archived-miralin-tren-ull
          path: android-overlay/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
