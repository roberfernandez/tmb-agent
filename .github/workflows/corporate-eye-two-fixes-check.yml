name: Verify two corporate eye changes (source baseline)
on:
  push:
    branches:
      - fix/corporate-eye-actions-notice-20261123
    paths:
      - 'miralin-corporatiu-android/**'
      - '.github/workflows/corporate-eye-two-fixes-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check Java tests and build from repository source
        run: gradle -p miralin-corporatiu-android :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: source-baseline-test-only-not-version-0-14-24
          path: miralin-corporatiu-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
