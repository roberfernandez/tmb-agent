<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a27"><title>VAGA · TMB Agent</title>
<style>html,body{margin:0;height:100%;color:#f4f2ea;background:#101a27;font-family:system-ui,sans-serif}body{display:flex;flex-direction:column;height:100dvh}header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 12px;background:#142333;border-bottom:1px solid #354a5e}header strong{color:#f4c76b}header a{border:1px solid #526577;border-radius:9px;background:#203247;color:inherit;padding:8px 12px;text-decoration:none;cursor:pointer;font:inherit}#notice{padding:20px;max-width:680px;margin:auto;line-height:1.6}#viewer{flex:1;width:100%;min-height:0;border:0} [hidden]{display:none!important}#notice a{color:#f4c76b}.tmb-return{display:inline-flex;align-items:center;justify-content:center;gap:0;width:52px;min-width:52px;height:52px;min-height:52px;padding:5px;box-sizing:border-box;border:2px solid #f1cb49;border-radius:999px;background:#182536;color:#f1cb49;flex:0 0 auto;text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tmb-return img{display:block;width:38px;height:38px;border-radius:10px;object-fit:contain;flex:0 0 auto}
.tmb-return:hover{background:#26394d;border-color:#ffe177;color:#ffe177}
.tmb-return:active{background:#30465e}
.tmb-return:focus-visible{outline:3px solid #98c5e0;outline-offset:3px}

</style></head>
<body><header><a class="tmb-return" href="../../" aria-label="Torna a TMBAgent"><img src="../../assets/icons/tmb-agent-192.png" width="38" height="38" alt=""></a><strong>VAGA</strong></header><section id="notice" role="status">Comprovant permisos…</section><iframe id="viewer" title="VAGA · Memòria obrera del Metro" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" hidden></iframe>
<script type="module">
import { SESSION_KEY } from '../../src/session.js';
const ENDPOINT='https://hhenkvendzengggrgook.supabase.co/functions/v1/tmb-agent-vaga';
const KEY='sb_publishable_QSPDTmh3fd0FH-VvAjH5KQ_Rfvzr2x_';
const notice=document.getElementById('notice'),viewer=document.getElementById('viewer');
let generation=0;
function show(message){notice.textContent=message;notice.hidden=false;viewer.hidden=true;viewer.removeAttribute('srcdoc');}
async function call(){
 let session;try{session=JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{}
 if(!session?.access_token)throw new Error('Inicia sessió a TMB Agent.');
 const response=await fetch(ENDPOINT+'?action=read',{method:'POST',cache:'no-store',signal:AbortSignal.timeout(60000),headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'text/plain'}});
 const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||'Servei no disponible');return data;
}
function empty(){show('VAGA no està disponible temporalment.');}
async function load(){const current=++generation;show('Comprovant permisos…');try{const result=await call();if(current!==generation)return;if(typeof result.html==='string'&&result.html){viewer.srcdoc=result.html;viewer.hidden=false;notice.hidden=true}else empty();}catch(e){if(current===generation)show(e.message);}}
window.addEventListener('storage',e=>{if(e.key===SESSION_KEY||e.key===null)load()});window.addEventListener('pageshow',e=>{if(e.persisted)load()});load();
</script></body></html>
