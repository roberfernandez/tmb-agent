    compileSdk 35

    defaultConfig {
        applicationId 'com.tmbagent.traineye'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.14.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
